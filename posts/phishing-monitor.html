<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍蝦資安監控站 | 龍蝦實驗室 🦞 Lobster Lab</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦞</text></svg>">
    <style>
        :root {
            --bg-color: #0d0d0f;
            --text-color: #d1d1d1;
            --border-color: #222222;
            --cyber-red: #ff3131;
            --cyber-green: #00ff41;
            --cyber-blue: #00d2ff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Fira Code', monospace, "PingFang TC";
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            border: 2px solid var(--cyber-red);
            padding: 20px;
            margin-bottom: 30px;
            background: rgba(255, 49, 49, 0.05);
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.2);
            width: 100%;
            max-width: 900px;
        }
        .search-container {
            margin: 20px 0;
            width: 100%;
            max-width: 900px;
        }
        #searchInput {
            width: 100%;
            padding: 15px;
            background: #1a1a1c;
            border: 1px solid var(--cyber-blue);
            color: var(--cyber-blue);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
        }
        .monitor-table {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .monitor-table th, .monitor-table td {
            border: 1px solid var(--border-color);
            padding: 15px;
            text-align: left;
        }
        .monitor-table th {
            background: #1a1a1c;
            color: var(--cyber-blue);
        }
        .status-active {
            color: var(--cyber-red);
            font-weight: bold;
            text-shadow: 0 0 5px var(--cyber-red);
        }
        .level-CRITICAL { color: var(--cyber-red); font-weight: bold; }
        .level-HIGH { color: #ff8c00; }
        .level-MEDIUM { color: #ffd700; }
        .scan-anim {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--cyber-green);
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 65, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 65, 0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦞 龍蝦資安監控站 (Lobster Security Monitor)</h1>
        <p><span class="scan-anim"></span>系統即時連線中... 數據源：Lobster Node 01</p>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 輸入關鍵字搜尋惡意網域..." onkeyup="filterData()">
    </div>

    <table class="monitor-table">
        <thead>
            <tr>
                <th>偵測時間</th>
                <th>惡意網域 / URL</th>
                <th>威脅等級</th>
                <th>狀態</th>
            </tr>
        </thead>
        <tbody id="dataBody">
            <!-- Data will be loaded here -->
            <tr><td colspan="4" style="text-align:center;">正在載入龍蝦情資庫...</td></tr>
        </tbody>
    </table>

    <script>
        let allData = [];

        async function loadData() {
            try {
                const response = await fetch('../data/phishing-list.json');
                allData = await response.json();
                renderTable(allData);
            } catch (error) {
                console.error('載入失敗:', error);
                document.getElementById('dataBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">情資載入失敗，請檢查網路連線。</td></tr>';
            }
        }

        function renderTable(data) {
            const body = document.getElementById('dataBody');
            body.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td style="color:var(--cyber-blue);">${item.url}</td>
                    <td class="level-${item.level}">${item.level}</td>
                    <td class="${item.status.includes('ACTIVE') ? 'status-active' : ''}">${item.status}</td>
                `;
                body.appendChild(row);
            });
        }

        function filterData() {
            const term = document.getElementById('searchInput').value.toUpperCase();
            const filtered = allData.filter(item => item.url.toUpperCase().includes(term));
            renderTable(filtered);
        }

        loadData();
    </script>

    <footer style="margin-top: 50px; font-size: 0.8rem; color: #555;">
        &copy; 2026 LOBSTER LAB - SECURE AGENT OPERATIONS
    </footer>
</body>
</html>
