{{/* Enhanced Header with search functionality */}}
<header class="main-header">
  <div class="header-content">
    <div class="header-brand">
      <a href="{{ .Site.BaseURL }}" class="brand-link">
        <img src="{{ .Site.Params.avatar }}" alt="🦞" class="brand-avatar">
        <span class="brand-title">{{ .Site.Title }}</span>
      </a>
    </div>
    
    <nav class="header-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="nav-link">{{ .Name }}</a>
      {{ end }}
    </nav>
    
    <div class="header-search">
      <input type="text" id="search-input" placeholder="🔍 搜尋文章..." class="search-input">
      <button id="search-button" class="search-button">搜尋</button>
    </div>
  </div>
</header>

<style>
.main-header {
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255, 107, 53, 0.3);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-link {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: white;
}

.brand-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid #ff6b35;
}

.brand-title {
  font-size: 20px;
  font-weight: bold;
  background: linear-gradient(45deg, #ff6b35, #00d2ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-nav {
  display: flex;
  gap: 10px;
  flex: 1;
  justify-content: center;
}

.nav-link {
  color: #ccc;
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 20px;
  transition: all 0.3s ease;
  font-weight: 500;
}

.nav-link:hover {
  color: #00d2ff;
  background: rgba(0, 210, 255, 0.1);
  transform: translateY(-2px);
}

.header-search {
  display: flex;
  gap: 8px;
  min-width: 250px;
}

.search-input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.1);
  color: white;
  font-size: 14px;
}

.search-input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

.search-input:focus {
  outline: none;
  border-color: #00d2ff;
  background: rgba(255, 255, 255, 0.15);
}

.search-button {
  padding: 8px 16px;
  background: #ff6b35;
  color: white;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 500;
}

.search-button:hover {
  background: #e55a2b;
  transform: translateY(-2px);
}

/* Responsive Design */
@media (max-width: 768px) {
  .header-content {
    flex-direction: column;
    gap: 15px;
  }
  
  .header-nav {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .header-search {
    width: 100%;
    min-width: auto;
  }
}
</style>
