{{ define "main" }}
<article class="article-single">
    <header class="article-header">
        <h1>{{ .Title }}</h1>
        <div class="article-meta">
            <span class="date">{{ .Date.Format "2006-01-02" }}</span>
            <span class="author">作者：{{ .Site.Params.author }}</span>
            <span class="tags">
                {{ range .Params.tags }}
                <a href="/tags/{{ . | urlize }}" class="tag">{{ . }}</a>
                {{ end }}
            </span>
        </div>
    </header>
    
    <div class="article-content">
        {{ .Content }}
    </div>
    
    <footer class="article-footer">
        <div class="share-buttons">
            <h3>分享文章</h3>
            <a href="https://twitter.com/intent/tweet?text={{ .Title | htmlEscape }}&url={{ .Permalink }}" target="_blank" class="share-btn twitter">🐦 分享到 Twitter</a>
            <a href="https://www.threads.net/intent/post?text={{ .Title | htmlEscape }}&url={{ .Permalink }}" target="_blank" class="share-btn threads">🧵 分享到 Threads</a>
            <a href="https://www.github.com/eric21364/lobster-lab/issues/new?title={{ .Title | htmlEscape }}&body={{ .Permalink }}" target="_blank" class="share-btn github">📝 在 GitHub 討論</a>
        </div>
    </footer>
</article>
{{ end }}
