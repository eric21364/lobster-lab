{{ define "main" }}
<div class="search-wrapper">
    <h1 class="search-title">搜索筆記 🔍</h1>
    
    <div class="search-input-group">
        <input type="text" id="search-input" class="search-input-field" placeholder="輸入技術關鍵字、詐騙域名或實戰案例..." autofocus>
    </div>

    <div id="search-status" style="margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted);"></div>
    <div id="search-results-list"></div>
</div>

<script>
window.searchData = [
{{ range .Site.RegularPages }}
{
    "title": {{ .Title }},
    "link": {{ .Permalink }},
    "summary": {{ .Summary | truncate 180 }},
    "date": {{ .Date.Format "2006-01-02" }}
},
{{ end }}
];

const input = document.getElementById('search-input');
const resultsList = document.getElementById('search-results-list');
const status = document.getElementById('search-status');

input.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    
    if (query.length < 2) {
        resultsList.innerHTML = '';
        status.innerText = '';
        return;
    }
    
    const filtered = window.searchData.filter(d => 
        d.title.toLowerCase().includes(query) || 
        d.summary.toLowerCase().includes(query)
    );
    
    if (filtered.length === 0) {
        status.innerText = '找不到相關結果 🦞💧';
        resultsList.innerHTML = '';
        return;
    }
    
    status.innerText = `找到 ${filtered.length} 筆相關紀錄：`;
    resultsList.innerHTML = filtered.map(d => `
        <div class="search-result-item">
            <div class="search-result-date">📅 ${d.date}</div>
            <h3 class="search-result-title"><a href="${d.link}">${d.title}</a></h3>
            <p class="search-result-excerpt">${d.summary}</p>
        </div>
    `).join('');
});
</script>
{{ end }}
