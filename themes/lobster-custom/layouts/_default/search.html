{{ define "main" }}
<div class="article-single">
    <h1>{{ .Title }}</h1>
    <div class="article-content">
        <input type="text" id="search-input" class="search-input" placeholder="輸入關鍵字搜尋龍蝦筆記...">
        <div id="search-results"></div>
    </div>
</div>

<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
window.searchData = {{ range .Site.RegularPages }}[{
    "title": {{ .Title }},
    "link": {{ .Permalink }},
    "content": {{ .Plain | truncate 200 }}
},]{{ end }};
// 這裡簡單實現搜尋邏輯
const input = document.getElementById('search-input');
const results = document.getElementById('search-results');
input.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    if (!query) { results.innerHTML = ''; return; }
    const filtered = window.searchData.filter(d => d.title.toLowerCase().includes(query) || d.content.toLowerCase().includes(query));
    results.innerHTML = filtered.map(d => `
        <div class="article-card" style="padding: 20px; margin-bottom: 15px;">
            <h3><a href="${d.link}">${d.title}</a></h3>
            <p style="font-size: 0.9rem; color: #a7aaad;">${d.content}</p>
        </div>
    `).join('');
});
</script>
{{ end }}
