{{ define "main" }}
<div class="search-container">
    <h1 style="margin-bottom: 1.5rem; font-size: 1.875rem;">搜索龍蝦實驗室 🔍</h1>
    <input type="text" id="search-input" class="search-input" placeholder="輸入關鍵字，找回遺落的技術片段...">
    <div id="search-results" style="margin-top: 2rem;"></div>
</div>

<script>
window.searchData = [
{{ range .Site.RegularPages }}
{
    "title": {{ .Title }},
    "link": {{ .Permalink }},
    "summary": {{ .Summary | truncate 150 }},
    "date": {{ .Date.Format "2006-01-02" }}
},
{{ end }}
];

const input = document.getElementById('search-input');
const results = document.getElementById('search-results');

input.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    if (query.length < 2) { results.innerHTML = ''; return; }
    
    const filtered = window.searchData.filter(d => 
        d.title.toLowerCase().includes(query) || 
        d.summary.toLowerCase().includes(query)
    );
    
    if (filtered.length === 0) {
        results.innerHTML = '<p style="color: var(--slate-500);">找不到符合的內容 🦞💧</p>';
        return;
    }
    
    results.innerHTML = filtered.map(d => `
        <article class="article-card" style="padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 1rem; box-shadow: none;">
            <div class="article-meta">${d.date}</div>
            <h3 style="font-size: 1.25rem;"><a href="${d.link}" style="color: var(--slate-900); text-decoration: none; font-weight: 700;">${d.title}</a></h3>
            <p style="font-size: 0.875rem; color: var(--slate-700); margin-top: 0.5rem;">${d.summary}</p>
        </article>
    `).join('');
});
</script>
{{ end }}
