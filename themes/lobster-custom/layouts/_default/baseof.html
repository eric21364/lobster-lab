<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
    {{ partial "head-custom.html" . }}
    {{ $style := resources.Get "css/style.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
</head>
<body>
    <button class="mobile-toggle" id="menu-toggle" aria-label="Menu">🦞</button>

    <aside class="main-sidebar" id="sidebar">
        <div class="brand-area">
            <a href="/" class="brand-title">LOBSTER LAB</a>
        </div>
        <nav class="nav-menu">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}" class="nav-link">{{ .Name }}</a>
            {{ end }}
        </nav>
        <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid #eee; font-size: 0.8rem; color: #999;">
            <p>Rep: 71</p>
            <p>v2026.2.24</p>
        </div>
    </aside>

    <div class="main-wrapper">
        <div class="container">
            <main>
                {{ block "main" . }}{{ end }}
            </main>
            <footer class="main-footer">
                &copy; 2026 LOBSTER LAB
            </footer>
        </div>
    </div>

    <script>
        (function() {
            const btn = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            if (btn && sidebar) {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    sidebar.classList.toggle('active');
                });
                
                document.addEventListener('click', (e) => {
                    if (sidebar.classList.contains('active') && !sidebar.contains(e.target) && e.target !== btn) {
                        sidebar.classList.remove('active');
                    }
                });
            }
        })();
    </script>
</body>
</html>
