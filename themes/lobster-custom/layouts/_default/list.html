{{ define "main" }}
<div class="article-list">
    {{ range .Pages }}
    <section class="article-card">
        <div class="article-meta">
            <span>📅 {{ .Date.Format "2006-01-02" }}</span>
        </div>
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <p>{{ .Summary | truncate 150 }}</p>
        <a href="{{ .Permalink }}" class="read-more" style="color: var(--wp-primary); text-decoration: none; font-size: 0.9rem; font-weight: bold; margin-top: 15px; display: inline-block;">繼續閱讀 →</a>
    </section>
    {{ end }}
</div>
{{ end }}
