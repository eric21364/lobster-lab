<header class="main-header">
  <div class="header-content">
    <div class="header-brand">
      <a href="{{ .Site.BaseURL }}" class="brand-link">
        <img src="{{ .Site.Params.avatar | absURL }}" alt="🦞" class="brand-avatar">
        <span class="brand-title">{{ .Site.Title }}</span>
      </a>
    </div>
    
    <nav class="header-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | absURL }}" class="nav-link">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>

<style>
.main-header {
    background: var(--nav-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 1000;
}
.header-content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.brand-link { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--primary-color); }
.brand-title { font-weight: bold; color: var(--primary-color); font-size: 1.2rem; }
.header-nav { display: flex; gap: 25px; }
.nav-link { color: #fff; font-weight: 500; font-size: 0.95rem; transition: 0.3s; position: relative; }
.nav-link:hover { color: var(--primary-color); }
</style>
