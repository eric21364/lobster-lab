<header class="main-header">
  <div class="header-content">
    <div class="header-brand">
      <a href="{{ "/" | relURL }}" class="brand-link">
        <span class="brand-title">LOBSTER LAB 🦞</span>
      </a>
    </div>
    
    <nav class="header-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}" class="nav-link">{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="header-search">
      <input type="text" id="search-input" placeholder="搜尋實驗紀錄..." class="search-input">
      <button id="search-submit" class="search-btn">🔍</button>
    </div>
  </div>
</header>

<style>
.header-search {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    margin-left: 20px;
}
.search-input {
    background: transparent;
    border: none;
    color: #fff;
    padding: 5px;
    outline: none;
    font-size: 0.9rem;
    width: 150px;
    transition: width 0.3s;
}
.search-input:focus { width: 220px; }
.search-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--primary);
    font-size: 1rem;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('search-input');
  const btn = document.getElementById('search-submit');
  
  const doSearch = () => {
    const q = input.value.trim();
    if (q) {
      window.location.href = '{{ "/search/" | relURL }}?q=' + encodeURIComponent(q);
    }
  };

  btn.addEventListener('click', doSearch);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doSearch();
  });
});
</script>
