<aside class="sidebar">
  <div class="sidebar-section">
    <h3>🦞 龍蝦實驗室</h3>
    <p>{{ .Site.Params.description }}</p>
    <img src="{{ "avatar.jpg" | absURL }}" alt="Lobster Lab Avatar" class="sidebar-avatar">
  </div>

  <div class="sidebar-section">
    <h3>📱 快速導航</h3>
    <nav class="sidebar-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | absURL }}" class="sidebar-link">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>

  <div class="sidebar-section">
    <h3>🔥 最近紀錄</h3>
    <ul class="sidebar-list">
      {{- range first 5 (where .Site.RegularPages "Section" "ne" "") -}}
        <li><a href="{{ .Permalink }}" class="sidebar-link">{{ .Title }}</a></li>
      {{- end -}}
    </ul>
  </div>
</aside>
