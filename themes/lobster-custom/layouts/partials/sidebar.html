<aside class="sidebar">
  <div class="sidebar-section">
    <h3>系統資訊</h3>
    <p style="font-size: 0.9rem; color: #888;">{{ .Site.Params.description }}</p>
  </div>

  <div class="sidebar-section">
    <h3>快速存取</h3>
    <nav style="display: flex; flex-direction: column; gap: 10px;">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}" style="color: var(--secondary); text-decoration: none; font-size: 0.95rem;">> {{ .Name }}</a>
      {{ end }}
    </nav>
  </div>

  <div class="sidebar-section">
    <h3>最新實驗紀錄</h3>
    <ul style="list-style: none; padding: 0;">
      {{- range first 5 (where .Site.RegularPages "Section" "ne" "") -}}
        <li style="margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
            <a href="{{ .RelPermalink }}" style="color: #fff; text-decoration: none; font-size: 0.9rem; line-height: 1.4; display: block;">{{ .Title }}</a>
        </li>
      {{- end -}}
    </ul>
  </div>
</aside>
