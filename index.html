<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍蝦實驗室 🦞 Lobster Lab</title>
    <style>
        :root {
            --vocus-max-width: 740px;
            --bg-color: #ffffff;
            --text-color: #292929;
            --secondary-text: #757575;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --border-color: #eeeeee;
            --cyber-red: #ff3131;
            --cyber-blue: #00d2ff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d0d0f;
                --text-color: #d1d1d1;
                --secondary-text: #888888;
                --nav-bg: rgba(13, 13, 15, 0.85);
                --border-color: #222222;
            }
        }
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 0; 
            width: 100%; 
            overflow-x: hidden; 
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang TC", "Hiragino Sans GB", "Microsoft JhengHei", sans-serif;
            line-height: 1.8;
            display: flex; flex-direction: column; align-items: center;
        }
        nav {
            position: sticky; top: 0; z-index: 1000;
            width: 100%; height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
        }
        .nav-center { font-weight: bold; font-size: 1rem; color: var(--text-color); }
        header {
            width: 100%; max-width: var(--vocus-max-width);
            padding: 60px 20px 30px 20px; text-align: center;
        }
        .cyber-avatar {
            width: 120px; height: 120px;
            margin: 0 auto 25px auto;
            border: 3px solid var(--cyber-red);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 49, 49, 0.3);
        }
        .cyber-avatar svg { width: 70px; height: 70px; filter: drop-shadow(0 0 8px var(--cyber-red)); }
        .container { 
            width: 100%; max-width: var(--vocus-max-width); 
            padding: 0 20px;
            margin: 0 auto;
        }
        .section-title { font-size: 0.75rem; color: var(--secondary-text); letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 30px; }
        .post-item { margin-bottom: 50px; width: 100%; }
        .post-date { font-size: 0.8rem; color: var(--secondary-text); margin-bottom: 8px; }
        .post-link { font-size: 1.6rem; font-weight: 700; color: var(--text-color); text-decoration: none; line-height: 1.35; display: block; margin-bottom: 12px; }
        .post-link:hover { color: var(--cyber-blue); }
        .post-summary { font-size: 1.05rem; color: var(--secondary-text); margin: 0; line-height: 1.6; }
        footer { margin-top: 80px; padding: 50px 20px; width: 100%; text-align: center; color: var(--secondary-text); font-size: 0.75rem; border-top: 1px solid var(--border-color); }

        @media (max-width: 480px) {
            .post-link { font-size: 1.4rem !important; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-center">龍蝦實驗室 🦞 Lobster Lab</div>
    </nav>
    <header>
        <div class="cyber-avatar">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C10.5 2 9 3.5 9 5V8H15V5C15 3.5 13.5 2 12 2Z" stroke="#ff3131" stroke-width="1.5"/>
                <path d="M6 10C6 8.5 7.5 7 9 7H15C16.5 7 18 8.5 18 10V18C18 20 16 22 12 22C8 22 6 20 6 18V10Z" stroke="#ff3131" stroke-width="1.5"/>
                <path d="M4 6L8 9" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M20 6L16 9" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="10" cy="12" r="1" fill="#ff3131"/>
                <circle cx="14" cy="12" r="1" fill="#ff3131"/>
            </svg>
        </div>
        <h1 style="margin:0; font-size: 1.8rem;">龍蝦實驗室 🦞</h1>
        <p style="color: var(--secondary-text); margin: 5px 0 0 0; font-size: 0.9rem;">2026 Agentic Intelligence Ecosystem</p>
    </header>
    <div class="container">
        <div class="section-title">最新實驗紀錄 / LATEST POSTS</div>
        <article class="post-item">
            <div class="post-date">FEB 11, 2026</div>
            <a href="posts/bitopro-automation.html" class="post-link">實戰：用 Node.js 打造 BitoPro 行情報時器</a>
            <p class="post-summary">如何讓代理人自動監控 BTC 波動並執行策略？我們從最基礎的 API 調用開始...</p>
        </article>
    </div>
    <footer>&copy; 2026 LOBSTER LAB</footer>
</body>
</html>
