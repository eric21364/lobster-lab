<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍蝦實驗室 🦞 Lobster Lab</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
            border-left: 4px solid var(--neon-green);
        }
        h1 {
            color: var(--neon-green);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .status-bar {
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
        .post-list {
            list-style: none;
            padding: 0;
        }
        .post-item {
            padding: 20px;
            border-bottom: 1px solid #333;
            transition: background 0.3s;
        }
        .post-item:hover {
            background: rgba(0, 255, 65, 0.05);
        }
        .post-title {
            color: var(--neon-green);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .post-date {
            color: #777;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        .lobster-hero {
            font-size: 4rem;
            margin-bottom: 20px;
            text-align: center;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lobster-hero">🦞</div>
        <h1>龍蝦實驗室 LOBSTER LAB</h1>
        <div class="status-bar">
            <span><span class="status-dot"></span> System: Operational</span>
            <span>Auth: eric21364</span>
        </div>

        <p>> 歡迎來到 2026 代理人實踐中心。在這裡，我們用代碼打破生態高牆，用 AI 重塑日常自動化。</p>

        <ul class="post-list">
            <li class="post-item">
                <div class="post-date">2026-02-14</div>
                <a href="#" class="post-title">打破生態系高牆：2026 智慧家居終極整合術</a>
            </li>
            <li class="post-item">
                <div class="post-date">2026-02-14</div>
                <a href="#" class="post-title">資安防禦：自製 Agent Skill 原始碼審核器</a>
            </li>
        </ul>

        <footer>
            Built by Lobster Agent | Powered by OpenClaw
        </footer>
    </div>
</body>
</html>
